# M6 · 合併 cohort 重訓最終模型的設定（紅線 4 · §7.6 的四段切分）。
#
# 這份設定描述的是**上線前的最後一次訓練**：把所有帶標籤的資料都用上，
# 而不是只用 Feb。SPEC §7.4 把紅線 4 的阻塞里程碑判在這裡，理由就是這件事 ——
# 一旦合併，881,693 位跨兩期的用戶（佔 Mar 的 90.81%）會讓任何隨機切分
# 把同一個人的兩列分到訓練與驗證兩邊。
#
# ⚠️ **合併之後就沒有時間外驗證集了。** 本專案只有兩個帶標籤的 cohort，
# 兩個都拿去訓練，剩下能報的分數就只有合併資料內部的 CV —— 那是同分布的
# 估計，必然優於 §4.2 的時間外分數，**兩者不可比大小**。要報「這個模型
# 有多好」，該引用的仍然是 feb_fixed → mar_fixed 那個時間外數字。

# 要合併哪些 cohort。名稱對應 src/data/cohort.py 的 COHORTS。
#
# 選 fixed 這一組（固定評分日）而不是 lead7，是因為它是 Kaggle 那條線：
# 合併重訓後可以對 apr_fixed 再產生一次預測，用外部分數量「多一個 cohort
# 值多少」。lead7 那一組沒有這種外部驗證管道。
cohorts:
  - feb_fixed
  - mar_fixed

features:
  use_logs: true

# ---------------------------------------------------------------------------
# 四段切分。§7.6 留下的那句「M6 重訓最終模型時應改採四段切分」。
# ---------------------------------------------------------------------------
#
# 四段各自對應**一個看著分數做的決定**，沒有一段是切出來卻用不到的：
#
#     train  模型權重
#     es     停在第幾輪
#     sel    要不要採用校準器（在這一段上看它有沒有幫助）
#     cal    fit 校準器
#
# 切了不用等於白白縮小訓練集；而兩個決定共用同一塊資料，那塊資料就被
# 最佳化了兩次 —— §7.6 記錄的正是後者（校準集與 M3 的選擇集重疊 100%）。
split:
  # **佔全體的比例**，不是「佔剩下的比例」。
  #
  # configs/calibration.yaml 的 early_stopping_fraction: 0.176 是手算的條件
  # 比例（0.15 / 0.85），那種數字沒有人覆核得動。這裡宣告最終比例，條件
  # 比例由 four_way_group_split() 自己算，並斷言四段加起來是 1。
  fractions:
    train: 0.70
    es: 0.10
    sel: 0.10
    cal: 0.10

  # 又一個新 seed。與 tuning.yaml(42)、calibration.yaml(20260809) 都不同 ——
  # 這一次的 sel/cal 必須是從沒被任何決定看過的資料。
  seed: 20260810

# ---------------------------------------------------------------------------
# 合併資料上的 CV。這是紅線 4 字面上規範的那一處。
# ---------------------------------------------------------------------------
cv:
  n_splits: 4
  seed: 20260810

  # 違規對照組：同一份合併資料、同樣的折數，改用不分群的 StratifiedKFold。
  # 兩者的差就是「紅線 4 擋掉多少分」。
  #
  # 這與紅線 6 的作法相同（§7.4 用三個實測違規的控制組量出 target encoding
  # 的代價）。只宣稱「這樣做才對」而不量代價，讀者無從判斷這條規定值不值
  # 得遵守 —— 而一條沒有代價的規定，遲早會有人為了方便繞過去。
  #
  # 代價：訓練次數 ×2。關掉它紅線 4 仍然成立，只是少了那個數字。
  violating_control: true

# 匯出的 artifact 目錄名。與既有三份並存（catboost_fixed / _lead0d / _lead7d），
# 不覆蓋 —— 那三份是報告裡每一個數字的出處。
artifact: catboost_fixed_full
