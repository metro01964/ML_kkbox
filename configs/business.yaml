# M4 · 業務指標（期望淨收益曲線與敏感度熱圖）的參數。
#
# 三個參數的地位完全不同，混在一起看會誤判哪個數字可以信：
#
#   LTV_saved   **由資料推導** —— 月費從 cohort 實測，續訂月數 = 1 / 月流失率
#   r_save      **純假設** —— 本資料集沒有實驗組／對照組，無法估計（SPEC §6.3）
#   C_offer     **業務決策** —— 不是估計值，是「我們打算送什麼」
#
# 決策門檻只取決於 p* = C_offer / (r_save × LTV_saved)，所以三者的不確定性
# 會互相吸收：LTV 打三折等於 C_offer 乘 3.33，已落在下方掃描區間內。

features:
  use_logs: true

# 用哪個模型產生機率。**CatBoost 是 §7.12 正式採用的模型**（Mar 0.15367，
# 配對 multi-seed 8/8），業務曲線必須用會上線的那一個 —— 用 LightGBM 畫出
# 來的曲線再漂亮，也不是我們要部署的東西。
#
# 超參數從 configs/model_comparison.yaml 讀，不在這裡複製一份：兩處各寫一份
# 遲早會不同步，而「這條曲線是用哪組參數算的」屆時就沒有答案。
#
# ⚠️ §7.10 的校準診斷用的是 LightGBM（當時 M3 的選定模型）。本腳本會另外
# 量一次 CatBoost 的整體低估幅度，因為那個數字會直接乘進每一筆金額。
model: catboost

business:
  # 基準情境：送一個月免費（KKBOX 月費 149 元）。
  #
  # 這個值會讓門檻高到只有最高風險的一小撮人達標 —— 那是刻意的。
  # 改成 50（折價券）會得到漂亮得多的曲線，但「多數情況不該投放」本身
  # 就是結論，湊一個好看的基準情境等於把結論藏起來。
  c_offer: 150

  # 挽回成功率。無資料可依據，取主動投放（用戶未表達退訂意圖）的中低段 ——
  # 「打電話來退訂時的挽留」成功率高得多，但那是另一種情境。
  r_save: 0.15

  # 每月天數。用 365.25 / 12 而不是 30：price_per_day 是用實際方案天數除出
  # 來的，換算回月費時差 1.3% 會直接進到 LTV。
  days_per_month: 30.4

sensitivity:
  # r_save 從「幾乎沒效」到「相當成功」，c_offer 從純推播到送兩個月。
  r_save: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  c_offer: [10, 30, 50, 100, 150, 200, 250, 300]

curve:
  step: 0.002    # K 的解析度：每 0.2 個百分點一個點

tracking:
  enabled: false
