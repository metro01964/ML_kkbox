# M6 · 服務設定（SPEC §8：「設定管理 · YAML in configs/ · 禁止硬編碼」）。
#
# ============================================================================
# 為什麼預設是提前 7 天的那個模型，即使它的分數比較差
# ============================================================================
#
# §7.15 實測：共同子集上 0.15173 → 0.17921（退步 18.11%）。但 §4.3 說得很清楚
# ——挽回優惠要提前寄出才來得及，**在到期日當天評分的模型無法上線**，它的分數
# 只是離線基準。
#
# 所以服務預設載入 `catboost_lead7d`。要載 T=0 的版本得在這裡改一個字，而
# `/predict` 的每一筆回應都會帶 `deployable: false` —— 部署錯版本是一個不會有
# 任何錯誤訊息的錯誤，只能靠回應自己講出來。
#
# 環境變數 `MODEL_ARTIFACT` 優先於這一行（Docker / HF Spaces 上沒有 data_root）。

artifact: catboost_lead7d

# --- msno 介面 ---------------------------------------------------------------
#
# `POST /predict {"msno": "..."}` 從 cohort 快取取這個人的特徵，再即時算機率與
# 原因碼（**不是查一份預先算好的名單** —— SPEC §7.14 明文禁止那件事）。
#
# ⚠️ 它有兩個前提，兩個都必須講出來：
#
#   1. 需要本機的 interim 快取。Docker / HF Spaces 上沒有資料，改成 false，
#      那時 msno 介面回 503 而不是安靜地回一個空結果。
#   2. 特徵來自一個**固定 cutoff 的歷史 cohort 快照**。真正的部署要以「現在」
#      為 cutoff 重算特徵，那需要一份線上的交易表，本專案沒有。
#
# 第一次呼叫要把整個 cohort 的特徵載進記憶體（Mar 約 97 萬列 × 61 欄，
# 約 0.5 GB），因此第一筆請求慢、之後很快。
msno_lookup:
  enabled: true

# --- 原因碼 ------------------------------------------------------------------
#
# 與 M5 同一組參數。`min_relative` 是**呈現判斷不是統計檢定**（見
# src/explain/reasons.py），所以它的值會跟著每一筆回應走：被壓下的句子留在
# `suppressed` 欄位裡，帶著 suppression_reason。
reasons:
  top_k: 3
  min_relative: 0.05

# --- 守門 --------------------------------------------------------------------
#
# artifact 記錄了匯出當時特徵程式的邏輯指紋。與現行程式不符時：
#
#   true   拒絕啟動，並要求重新匯出（模型是舊邏輯的特徵訓練出來的）
#   false  照樣服務，把不符寫進 /health 的 warnings
#
# 預設 true。這是 §7.11 的教訓：程式改了、快取還是舊的，而分數只是安靜地變動。
strict_feature_fingerprint: true
